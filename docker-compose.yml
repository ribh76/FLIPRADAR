services:
  db:
    image: postgres:16-alpine
    container_name: flipradar-db
    environment:
      POSTGRES_DB: flipradar
      POSTGRES_USER: flipradar_app
      POSTGRES_PASSWORD: flipradar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipradar_app -d flipradar"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: flipradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flipradar-backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      FRONTEND_URL: http://127.0.0.1:5173
      LOG_LEVEL: INFO
      SQLALCHEMY_LOG_LEVEL: WARNING
      UVICORN_ACCESS_LOG_LEVEL: INFO
      DATABASE_URL: ""
      ALEMBIC_DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: flipradar
      DATABASE_USER: flipradar_app
      DATABASE_PASSWORD: flipradar_dev_password
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "10"
      JWT_SECRET_KEY: local-development-secret-change-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PASSWORD_MIN_LENGTH: "8"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: "*"
      CORS_ALLOW_HEADERS: "*"
      EMAIL_ENABLED: "false"
      EMAIL_PROVIDER: smtp
      EMAIL_FROM_ADDRESS: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      EMAIL_TIMEOUT_SECONDS: "10"
      EBAY_API_ENABLED: "false"
      EBAY_API_CONFIGURED: "false"
      EBAY_API_KEY: ""
      EBAY_API_SECRET: ""
      EBAY_API_TIMEOUT_SECONDS: "10"
      BRICKLINK_API_ENABLED: "false"
      BRICKLINK_API_CONFIGURED: "false"
      BRICKLINK_CONSUMER_KEY: ""
      BRICKLINK_CONSUMER_SECRET: ""
      BRICKLINK_TOKEN_VALUE: ""
      BRICKLINK_TOKEN_SECRET: ""
      BRICKLINK_API_TIMEOUT_SECONDS: "10"
      LLM_ENABLED: "false"
      LLM_PROVIDER: openai
      LLM_API_KEY: ""
      OPENAI_API_KEY: ""
      LLM_MODEL: gpt-5-mini
      LLM_TIMEOUT_SECONDS: "30"
      LLM_MAX_TOKENS: "1500"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -lc
      "python /app/scripts/wait_for_database.py &&
      python -m alembic upgrade head &&
      python /app/scripts/seed_database.py &&
      python -m uvicorn flipradar.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/db-health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: flipradar-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

  # Opt-in only: `docker compose --profile workers up celery-worker celery-beat`.
  # Kept out of the default stack so the monitoring worker is configured but not deployed.
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flipradar-celery-worker
    profiles: ["workers"]
    environment:
      APP_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: flipradar
      DATABASE_USER: flipradar_app
      DATABASE_PASSWORD: flipradar_dev_password
      DATABASE_SSL_MODE: disable
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WATCHLIST_WORKER_ENABLED: "true"
      WATCHLIST_PROVIDER_HOURLY_LIMIT: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A flipradar.worker.celery_app:celery_app worker --loglevel=INFO

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flipradar-celery-beat
    profiles: ["workers"]
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WATCHLIST_WORKER_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A flipradar.worker.celery_app:celery_app beat --loglevel=INFO

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
