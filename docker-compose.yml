services:
  db:
    image: postgres:16-alpine
    container_name: flipradar-db
    environment:
      POSTGRES_DB: flipradar
      POSTGRES_USER: flipradar_app
      POSTGRES_PASSWORD: flipradar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipradar_app -d flipradar"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: flipradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flipradar-backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: INFO
      SQLALCHEMY_LOG_LEVEL: WARNING
      UVICORN_ACCESS_LOG_LEVEL: INFO
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: flipradar
      DATABASE_USER: flipradar_app
      DATABASE_PASSWORD: flipradar_dev_password
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "10"
      JWT_SECRET_KEY: local-development-secret-change-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -lc
      "python /app/scripts/wait_for_database.py &&
      python -m alembic upgrade head &&
      python /app/scripts/seed_database.py &&
      python -m uvicorn flipradar.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/db-health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: flipradar-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
