name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flipradar
          POSTGRES_USER: flipradar_app
          POSTGRES_PASSWORD: flipradar_ci_password
        options: >-
          --health-cmd "pg_isready -U flipradar_app -d flipradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://flipradar_app:flipradar_ci_password@localhost:5432/flipradar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run Ruff
        run: python -m ruff check backend scripts

      - name: Check Black formatting
        run: python -m black --check backend scripts

      - name: Run Pyright
        run: python -m pyright

      - name: Run Alembic migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: frontend

      - name: Run TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Run Vitest
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build-backend-image:
    name: Build backend production image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: flipradar-backend:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

  build-frontend-image:
    name: Build frontend production image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          tags: flipradar-frontend:ci
          load: true
          push: false
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
